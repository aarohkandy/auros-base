# The pinned upstream digest. Resolved by CI, never edited by hand.
# Check S1 fails the build if the Containerfile FROM does not resolve to exactly this.
# A tag is a moving target: two builds a day apart would be different operating systems
# wearing the same name, and "same recipe in, same image out" would stop being true.
UPSTREAM_IMAGE=ghcr.io/ublue-os/aurora
UPSTREAM_TAG=stable
UPSTREAM_DIGEST=sha256:ad1f8f6b19c93afad30463e5e8bb532e25a97a7b9da90713233433e470e7ba46
UPSTREAM_RESOLVED_AT=2026-10-27T09:49:00Z
UPSTREAM_CREATED=2026-10-27T01:32:55Z
UPSTREAM_ARCH=linux/amd64
# MEASURED 2026-09-21 against the pinned digest, the same quantity tools/resolve-upstream.sh emits
# (`skopeo inspect --raw docker://<image>@<digest> | jq '[.layers[].size] | add'`), read straight off
# ghcr.io with an anonymous pull token. It replaces 3758096384, which is exactly 3.5 GiB and so
# cannot have been a measurement of anything — and this file's own header says it is resolved by CI
# and never edited by hand. The absent UPSTREAM_LAYERS said the same thing: the resolver emits it and
# the committed file did not have it.
#
# The difference is only 1.4%, which is the point: it was small enough to never be questioned, and
# S6 compares an image against a budget derived from this number.
UPSTREAM_PULL_SIZE_BYTES=3664902106
UPSTREAM_LAYERS=256
UPSTREAM_LAYER_MEDIA_TYPE=application/vnd.oci.image.layer.v1.tar+zstd
