# Auros — installed to /usr/lib/systemd/system/display-manager.service.d/50-auros-accounts.conf.
# man systemd.unit: drop-ins for an alias name are loaded for the unit it aliases, so this applies to
# whichever display manager the image links as display-manager.service.
#
# When auros-accounts could not leave a single account that can sign in, it writes the marker below and
# puts the reason in /etc/issue.d. Showing a graphical sign-in screen with nobody on it would hide that
# reason; man systemd.service: an ExecCondition= exiting 1-254 skips the unit without marking it failed,
# so the console with the reason is what the machine shows instead.
[Unit]
After=auros-accounts.service

[Service]
ExecCondition=/usr/bin/test ! -e /run/auros/accounts-failed
