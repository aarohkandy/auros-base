# Auros — the Windows-programs TEMPLATE.  Installed to /usr/share/auros/windows-apps/windows-apps.conf
# and read by /usr/libexec/auros/auros-bottles-setup.
#
# DECISIONS.md D16, verbatim consequence: "a Bottles prefix CANNOT be pre-configured inside the OCI
# image — prefixes live in $HOME, which no bootc image controls.  The image ships the Flatpak (via
# preinstall) plus a TEMPLATE under /usr; a `systemd --user` oneshot with a stamp file materialises it
# per user at first run."
#
# So this file is the template, and it is a DESCRIPTION of the prefix to create, not a copy of one.
# That distinction is deliberate.  We could have shipped a skeleton bottle.yml under /usr and copied it
# into $HOME, but a bottle.yml is Bottles' own internal format, it changes between Bottles releases, and
# a hand-written one that a newer Bottles rejects produces a bottle that exists and does not work —
# which is the worst of the three possible outcomes.  Instead the oneshot drives `bottles-cli new`, so
# the prefix is created by the software that owns the format, at the version the user actually has.

[bottle]
# The name the user sees inside Bottles.
name=Windows
# Bottles environment: application | gaming | custom.  "application" is the right profile for the
# line-of-business .exe files schools and nonprofits actually have.
environment=application

[folders]
# Created in the user's home directory, alongside Documents and Downloads, with README.txt inside it.
# A person who has been handed a Windows .exe needs somewhere obvious to put it that is not the desktop.
incoming=Windows Programs
