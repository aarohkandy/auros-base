# AUROS — /usr/lib/systemd/coredump.conf.d/10-auros.conf
#
# Two reasons, and the second is the load-bearing one:
#   1. A core dump is a verbatim copy of a crashed process's memory, written world-readable-ish into
#      /var/lib/systemd/coredump. On a shared machine that is the contents of somebody's documents.
#   2. The `small-disk` profile (matrix/profiles.yaml) has a 64 GB floor that must hold the install
#      plus TWO bootc deployments plus Flatpaks with >=15% free. A crash loop that writes
#      multi-hundred-megabyte dumps eats the headroom that makes rollback (U2/U3) possible.
#
# Backtraces still reach the journal, so a crash is still diagnosable; the memory image is not kept.
[Coredump]
Storage=none
ProcessSizeMax=0
