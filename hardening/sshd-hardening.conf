# AUROS — /etc/ssh/sshd_config.d/10-auros-hardening.conf
#
# sshd is MASKED in this image (build/10-hardening.sh). This file exists for the case where an
# administrator deliberately unmasks it: what comes back up should not be the stock configuration.
#
# sshd_config takes the FIRST value it sees for a keyword, so a drop-in that sorts early wins over
# /etc/ssh/sshd_config's own defaults. 10- is early.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 30
