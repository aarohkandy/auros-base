# AUROS — /usr/lib/systemd/system/mcelog.service.d/10-auros-cpu-supported.conf
#
# mcelog decodes Intel machine checks. On AMD family 0x10 and later it exits 1 ("mcelog does not
# support this processor. Please use the edac_mce_amd module instead."), and the kernel's EDAC driver
# (edac_mce_amd / amd64_edac) is what decodes MCEs there. Upstream's own guard,
# ConditionPathExists=!/sys/module/edac_mce_amd/initstate, only works if that module is already loaded
# when mcelog starts, which nothing orders; run 35616444839 booted degraded on every profile because of it.
#
# mcelog's own --is-cpu-supported runs the same vendor/family test and exits 1 when it would refuse.
# ExecCondition= exit 1-254 skips the unit without marking it failed (systemd.service(5)).
[Service]
ExecCondition=/usr/sbin/mcelog --is-cpu-supported
