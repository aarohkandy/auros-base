# AUROS — /usr/lib/sysctl.d/10-auros-hardening.conf
#
# Two settings, both of which only remove information from unprivileged view. Nothing here changes
# networking or process behaviour, because a hardening default that breaks a printer is a hardening
# default that gets turned off by the first person who needs to print.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 1
