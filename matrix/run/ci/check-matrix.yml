# REFERENCE workflow for the check matrix. It is NOT installed under .github/workflows/ by this
# harness — the nightly/publish workflow belongs to work item A7 and to whoever owns that file. Copy
# it, or call the steps from an existing job. Everything here is a measured fact or a recorded
# decision, with the source named.
#
#   ubuntu-24.04, not ubuntu-latest    D23 — latest migrates to 26.04 between 2026-10-19 and 11-19
#   bash -euo pipefail                 D19 — our own probe scored a failing build as passing through `tail`
#   cosign v3.1.3 exactly              D25/D17 — the new-bundle-format flag is deprecated upstream
#   chmod 666 /dev/kvm                 measured in docs/evidence/2026-09-20-runner-probe.md
#   build TWICE                        S7 has no other way to be evidence
name: check-matrix

on:
  workflow_call:
    inputs:
      image:        { type: string, required: true }
      recipe:       { type: string, required: false, default: '' }
      profiles:     { type: string, required: false, default: '' }
      budget_bytes: { type: string, required: true }
    secrets:
      cosign_key: { required: true }

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /
      - uses: sigstore/cosign-installer@v3
        with: { cosign-release: 'v3.1.3' }
      - name: Build twice — S7 is not evidence otherwise
        id: build
        run: |
          podman build -t localhost/auros-base:a -f auros-base/Containerfile auros-base
          podman build -t localhost/auros-base:b -f auros-base/Containerfile auros-base
          echo "digest=$(podman image inspect localhost/auros-base:a --format '{{.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "second=$(podman image inspect localhost/auros-base:b --format '{{.Digest}}')" >> "$GITHUB_OUTPUT"
      # S8 needs the image to be IN a registry, signed. Push to a staging tag first and promote only
      # after the matrix passes — see run/README.md, "The S8 ordering problem".
      - name: Static checks
        run: |
          auros-base/matrix/run/run-static.sh \
            --image localhost/auros-base:a \
            --digest '${{ steps.build.outputs.digest }}' \
            --second-digest '${{ steps.build.outputs.second }}' \
            --budget-bytes '${{ inputs.budget_bytes }}' \
            --registry-ref "ghcr.io/${{ github.repository_owner }}/auros-base-staging@${{ steps.build.outputs.digest }}" \
            --out "$RUNNER_TEMP/matrix-run"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: static-run, path: ${{ runner.temp }}/matrix-run }

  boot:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false      # one red profile must not hide the others; the gate needs every profile
      matrix:
        profile: [uefi-modern, uefi-secureboot, bios-legacy, low-ram, old-cpu, small-disk, tpm12]
    steps:
      - uses: actions/checkout@v4
      - name: KVM, QEMU, firmware, swtpm
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          # ovmf carries OVMF_VARS_4M.ms.fd, which is what makes uefi-secureboot Microsoft's keys
          # rather than our own; swtpm-tools is what makes tpm12 a test instead of a hope.
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools libguestfs-tools
      - run: |
          auros-base/matrix/run/run-boot.sh --profile '${{ matrix.profile }}' \
            --image localhost/auros-base:a --out "$RUNNER_TEMP/matrix-run"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: boot-${{ matrix.profile }}, path: ${{ runner.temp }}/matrix-run }

  update:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
        with: { cosign-release: 'v3.1.3' }
      - run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools libguestfs-tools
      - name: U1..U5 and R1
        env:
          COSIGN_PASSWORD: ${{ secrets.cosign_key_password }}
        run: |
          printf '%s' '${{ secrets.cosign_key }}' > "$RUNNER_TEMP/cosign.key"
          auros-base/matrix/run/run-update.sh --image localhost/auros-base:a \
            --signing-key "$RUNNER_TEMP/cosign.key" --out "$RUNNER_TEMP/matrix-run"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: update-run, path: ${{ runner.temp }}/matrix-run }

  verdict:
    needs: [static, boot, update]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: ${{ runner.temp }}/artifacts }
      - name: Merge the fragments and emit results.json
        run: |
          mkdir -p "$RUNNER_TEMP/matrix-run/checks" "$RUNNER_TEMP/matrix-run/work"
          find "$RUNNER_TEMP/artifacts" -name '*.jsonl' -exec cp {} "$RUNNER_TEMP/matrix-run/checks/" \;
          find "$RUNNER_TEMP/artifacts" -name 'compat-rows.tsv' -exec cat {} \; >> "$RUNNER_TEMP/matrix-run/compat-rows.tsv" || true
          find "$RUNNER_TEMP/artifacts" -name 'pull-bytes' -exec cp {} "$RUNNER_TEMP/matrix-run/work/" \; || true
          node auros-base/matrix/run/emit-results.mjs \
            --run-dir "$RUNNER_TEMP/matrix-run" \
            --image "ghcr.io/${{ github.repository_owner }}/auros-base" \
            --digest '${{ needs.static.outputs.digest }}' \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            ${{ inputs.recipe && format('--recipe {0}', inputs.recipe) || '' }}
      # This step is what a publish is allowed to depend on. It recomputes the verdict, ignores the
      # harness's own, and exits non-zero on anything short of a full pass.
      - name: Record the pass (or refuse to)
        run: |
          node auros-base/matrix/run/record-pass.mjs --results "$RUNNER_TEMP/matrix-run/results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results, path: ${{ runner.temp }}/matrix-run/results*.json }
