# ─────────────────────────────────────────────────────────────────────────────────────────────────
# build — the only path by which an image becomes `ghcr.io/aarohkandy/auros-base:hardened`.
#
# Spec §4.3: "Never publish an image that has not booted in a VM and passed the full check matrix.
# Enforce with a CI gate that cannot be overridden by a flag."
#
# THE NO-BYPASS PROPERTY, stated so it can be audited rather than believed:
#
#   * This workflow has NO `workflow_dispatch:` trigger. There is no button.
#   * Its `workflow_call:` accepts NO `inputs:` and NO `secrets:`. A caller cannot parameterise it.
#   * Nothing in this file reads an input, a repository variable, or an environment variable to decide
#     whether to publish. The `publish` job's only gate is the exit status of
#     `node meta/tools/gate.mjs <digest> --image <image>`, which is the ONE command-line form that
#     program has. There are no subcommands and no `--ledger`: the ledger path is derived by gate.mjs
#     from its own location, precisely so that no line in this file can point it somewhere friendlier.
#   * RECORDING AND GATING ARE DIFFERENT JOBS WITH DIFFERENT PERMISSIONS, and that is the load-bearing
#     part. `record` holds `contents: read` and no registry credential; it writes the pass and pushes
#     it to the control repo. `publish` holds `packages: write`, never sees the fragments or
#     results.json, and gates on a ledger it re-fetches from `origin/main`. An earlier version of this
#     file wrote the pass and read it back nine lines later in the same job, off the same disk — the
#     evidence was manufactured by the job being gated, and `--ledger` "pointing at the durable file"
#     named the file the previous step had just written. That is a formality, not a gate.
#   * The gate step is preceded by a NEGATIVE CONTROL that asks the same binary about a digest nobody
#     recorded and requires exit 1. If the gate says yes to that, or cannot parse the invocation at
#     all, the run stops before the tag moves. D19: a step that cannot go red is not a check, so this
#     one goes red on demand, every run.
#   * No job and no step sets `continue-on-error` (the only occurrence of that string in this file
#     is this sentence). A step that cannot fail is not a check — D19.
#   * Every job that could publish `needs:` the gate job, so a skipped or failed gate skips publish.
#   * The gate is FAIL-CLOSED: a missing gate.mjs, a missing ledger, a missing harness, an unreadable
#     results.json, an unparseable fragment, an unpushed ledger row and a ledger commit that is not an
#     ancestor of main all stop the publish. Absence of evidence is a fail.
#
#   I checked this file for a bypass path and there is none. If you are adding one, you are changing
#   what the company sells — take it to DECISIONS.md first.
#
# WHAT REACHES THE REGISTRY, AND WHEN
#
#   stage-<run_id>   pushed early, UNSIGNED, so the parallel check jobs have something to pull.
#                    A customer machine cannot install it: D8's in-image policy is sigstoreSigned for
#                    the whole `ghcr.io/aarohkandy` scope, and an unsigned image fails that policy.
#                    SAID PLAINLY, because it is easy to read the paragraph above as a guarantee it is
#                    not: this push has no `if:` guard, so a same-repo pull request also pushes an
#                    unsigned, as-yet-unchecked image into the customer-facing package, before the
#                    static and boot jobs have run. Nothing can install it and nothing follows the
#                    tag, but it is there and it accumulates until the cleanup job can delete it. The
#                    fix that removes the accumulation rather than apologising for it is to stage into
#                    a separate package; that is a change to how the check jobs are fed and is tracked
#                    rather than half-done here.
#   <digest>         signed once static + boot are green, because U1-U5 need a real signature to
#                    exercise the real enforcement path. A signed digest with no tag pointing at it is
#                    not reachable by any machine that has not been hand-fed the digest.
#   :hardened        moved ONLY after tools/gate.mjs exits 0. This is the tag machines follow, so this
#                    is the tag the gate protects.
#
# D19: `set -o pipefail` everywhere. Our own boot probe scored a failing build as a pass because the
# step piped through `tail`. A step that cannot fail is not a check.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
name: build

on:
  push:
    branches: [main]
    # A README change must not re-run a fifty-minute image build. It did, once.
    # Probe workflows are measurement scaffolding; changing one must not rebuild the image. Several
    # agents push to this repo, and each build takes ~50 minutes and QUEUES behind the last, so an
    # unrelated push can put the build everyone is waiting on an hour further away.
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', '.gitignore', '.github/workflows/probe-*.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', '.gitignore']
  # Called by nightly.yml. No `inputs:` and no `secrets:` block — a caller gets exactly this pipeline
  # or none of it. Outputs are read-only facts about what happened; nothing here steers the run.
  workflow_call:
    outputs:
      digest:
        description: The content digest that was built (whether or not it was published).
        value: ${{ jobs.build.outputs.digest }}
      published:
        description: "\"true\" only if the gate passed and :hardened was moved. Empty if the publish job never ran."
        value: ${{ jobs.publish.outputs.published }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run on main: it may be mid-publish. PR runs are cancellable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.sha || github.ref_name }}
  META_REPO: aarohkandy/auros
  STAGE_TAG: stage-${{ github.run_id }}
  # NOTE: cosign's version, bundle-format flag and installer action are NOT set here. They live in
  # `signing/cosign.lock`, whose first line says "CI reads this file; nothing hardcodes a version
  # anywhere else". The `uses:` ref below is the one thing that cannot be dynamic in Actions, so it
  # is written out AND asserted against the lock.
  # A publish only happens on the default branch and never from a pull request. Fork PRs have a
  # read-only token and no OIDC anyway; this makes the intent explicit rather than incidental.
  IS_PUBLISHABLE: ${{ github.event_name != 'pull_request' && github.ref_name == 'main' }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  plan:
    name: plan · S1 base is pinned by digest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image:          ${{ steps.cfg.outputs.image }}
      mirror:         ${{ steps.cfg.outputs.mirror }}
      recipes_repo:   ${{ steps.cfg.outputs.recipes_repo }}
      base_ref:       ${{ steps.s1.outputs.base_ref }}
      base_via:       ${{ steps.s1.outputs.base_via }}
      matrix_version: ${{ steps.cfg.outputs.matrix_version }}
      profiles:       ${{ steps.cfg.outputs.profiles }}
      publishable:    ${{ steps.cfg.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # The meta/control repo carries tools/gate.mjs and attest/passed-digests.tsv (D6). It is public,
      # so the default GITHUB_TOKEN can read it — what the default token cannot do is WRITE to it,
      # which is the same wall as D18 and is handled in the publish job.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.META_REPO }}
          path: meta
          ref: main

      - name: Namespace and matrix facts come from files, never from this workflow
        id: cfg
        run: |
          # D1: the namespace lives in exactly one file. Hardcoding "ghcr.io/aarohkandy/auros-base"
          # here would mean a rename is two files, which is how single-source-of-truth dies.
          IMAGE=$(jq -r '.baseImage'      meta/auros.config.json)
          RECIPES=$(jq -r '.repos.recipes' meta/auros.config.json)
          [ -n "$IMAGE" ] && [ "$IMAGE" != "null" ] || { echo "auros.config.json has no .baseImage"; exit 1; }
          echo "image=$IMAGE"          >> "$GITHUB_OUTPUT"
          echo "recipes_repo=$RECIPES" >> "$GITHUB_OUTPUT"

          # D21's mirror, derived from the same one file rather than written out again here.
          REG=$(jq -r '.registry' meta/auros.config.json)
          ORG=$(jq -r '.org'      meta/auros.config.json)
          echo "mirror=${REG}/${ORG}/auros-upstream-mirror" >> "$GITHUB_OUTPUT"

          MV=$(python3 -c 'import yaml,sys; print(yaml.safe_load(open("matrix/checks.yaml"))["matrix_version"])')
          echo "matrix_version=$MV" >> "$GITHUB_OUTPUT"

          # "run boot checks on every profile" is read from profiles.yaml, not typed out here. A
          # profile added to that file is a profile this workflow starts booting, with no edit.
          PROFILES=$(python3 -c 'import yaml,json;print(json.dumps([p["id"] for p in yaml.safe_load(open("matrix/profiles.yaml"))["profiles"]]))')
          echo "profiles=$PROFILES" >> "$GITHUB_OUTPUT"
          echo "profiles to boot: $PROFILES"

          echo "publishable=${IS_PUBLISHABLE}" >> "$GITHUB_OUTPUT"
          echo "publishable: ${IS_PUBLISHABLE}"

      - name: S1 — resolved FROM digest == base.lock
        id: s1
        run: ./tools/resolve-upstream.sh assert --mirror '${{ steps.cfg.outputs.mirror }}'

      - name: Is D21 actually in force?
        run: |
          # Not a gate — A1 owns the Containerfile and may not have flipped FROM to the mirror yet.
          # But it must be visible, because the day it matters is the day upstream garbage-collects
          # our pin and every build fails on an image nobody touched.
          if [ '${{ steps.s1.outputs.base_via }}' = 'upstream' ]; then
            echo "::warning::FROM still resolves against upstream, not the mirror. D21 says the pin is deleted by upstream's weekly GHCR cleanup after ~90 days or 7 newer stable tags. The mirror is populated by this run regardless, so flipping FROM to '${{ steps.cfg.outputs.mirror }}' is a one-line change in the Containerfile."
          else
            echo "D21 in force: FROM resolves via the mirror."
          fi

      - name: Upstream drift (information, not a gate)
        run: |
          # Deliberately NOT a failure. A tag moving upstream is the nightly's job to act on; if it
          # failed the build, every push the morning after upstream ships would go red for reasons
          # unrelated to the change under test, and people learn to ignore red.
          set +e
          ./tools/resolve-upstream.sh drift
          rc=$?
          set -e
          case "$rc" in
            0)  echo "upstream tag still points at the locked digest" ;;
            10) echo "::notice::upstream has moved since base.lock was written — nightly.yml will act on it" ;;
            *)  echo "::warning::could not reach the upstream registry to check drift (rc=$rc); this does not gate the build" ;;
          esac

      - name: The gate must exist before anything can be built
        run: |
          # Fail closed, and fail EARLY. Discovering at publish time that the gate is missing means we
          # have spent an hour of CI and are one `|| true` away from shipping ungated.
          missing=0
          [ -f meta/tools/gate.mjs ] || { echo "::error::meta/tools/gate.mjs is absent — the publish gate (TASKS 0.5) has not landed"; missing=1; }
          [ -f matrix/run/record-pass.mjs ] || { echo "::error::matrix/run/record-pass.mjs is absent — nothing can write a pass, so nothing can ever satisfy the gate"; missing=1; }
          # The gate and the recorder must agree about the argv this pipeline uses. Asking the gate
          # about a digest nobody recorded costs nothing and answers the only question that matters
          # about the invocation: exit 1 is a refusal (good), exit 2 means this workflow and that
          # program disagree about the command line and the publish step would die before gating.
          SENTINEL="sha256:$(printf '0%.0s' $(seq 1 64))"
          set +e; node meta/tools/gate.mjs "$SENTINEL" >/dev/null 2>&1; grc=$?; set -e
          case "$grc" in
            1) echo "gate CLI contract OK — refuses an unrecorded digest with exit 1" ;;
            0) echo "::error::the gate ALLOWS a digest that was never tested. Nothing is built until that is fixed."; missing=1 ;;
            *) echo "::error::the gate exited ${grc} on 'gate.mjs <digest>' — it cannot decide, so it cannot gate. This is how the publish step silently stopped running: it called subcommands that do not exist."; missing=1 ;;
          esac
          [ -x matrix/run.sh ] || [ -f matrix/run.sh ] || { echo "::error::matrix/run.sh is absent — the check-matrix harness (TASKS A8) has not landed"; missing=1; }
          [ -f Containerfile ] || { echo "::error::Containerfile is absent (TASKS A1)"; missing=1; }
          if [ "$missing" = "1" ]; then
            echo "Refusing to build. An image that cannot be gated must not exist." >&2
            exit 1
          fi
          echo "gate, harness and Containerfile all present"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  build:
    name: build · S7 determinism
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write   # to push the UNSIGNED staging tag the check jobs pull from
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      stage_ref: ${{ steps.push.outputs.stage_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0   # SOURCE_DATE_EPOCH comes from the commit, so we need its timestamp

      - name: Reclaim disk
        run: |
          # Measured, not guessed: docs/evidence/2026-09-20-runner-probe.md — 145 G total, 110 G free
          # after this. Two full builds plus two chunked outputs fit. We do NOT move podman's
          # graphroot to /mnt: probe-boot revision 1 did that and broke bootc-image-builder, which
          # mounts the host store at its default path and then finds a libpod DB pointing elsewhere.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          echo "--- after reclaim ---"; df -h /

      - name: Registry login, as both users that need it
        run: |
          # `skopeo` runs as the runner user; every podman command here runs as root. They keep
          # separate auth files, so logging in once is logging in for the wrong half of the build.
          # ORDER MATTERS HERE, and getting it wrong cost us a build.
          #
          # `sudo skopeo login` can land on the RUNNER USER's /run/user/<uid>/containers/auth.json and
          # write it as root — after which the unprivileged skopeo gets "permission denied" on its own
          # auth file. So the privileged logins go first, and the unprivileged login goes LAST and
          # rewrites the file it owns. We do not move the privileged logins to a custom --authfile,
          # because every later `sudo podman push` in this workflow expects the default path, and a fix
          # that silently breaks publishing is worse than the bug.
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ github.token }}" | sudo skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Repair ownership if a privileged login clobbered the unprivileged auth file, then log in
          # unprivileged so the file is definitely ours and definitely current.
          AUTH="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/containers/auth.json"
          sudo chown -R "$(id -u):$(id -g)" "$(dirname "$AUTH")" 2>/dev/null || true
          echo "${{ github.token }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          ls -l "$AUTH" 2>/dev/null || echo "(no unprivileged auth file — explicit creds are used where it matters)"

      - name: D21 — mirror the pinned upstream digest into our namespace
        if: env.IS_PUBLISHABLE == 'true'
        env:
          MIRROR: ${{ needs.plan.outputs.mirror }}
          # Explicit, because `sudo skopeo login` earlier in this job writes the runner user's
          # auth.json as root and the unprivileged skopeo here then cannot read its own file.
          AUROS_REGISTRY_USER: ${{ github.actor }}
          AUROS_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          # Upstream deletes the digest we pin — weekly cleanup, older-than 90 days, keep-n-tagged 7.
          # `skopeo copy --all` preserves the manifest digest, so the mirror is the same bytes under a
          # name we control. This is what keeps spec §1.3 ("if we vanish, you rebuild your exact OS
          # from the file") true after upstream forgets.
          #
          # Fork PRs cannot push to our registry, so this is scoped to publishable runs. A fork PR
          # that needs the mirror to build will find it already populated by an earlier run on main.
          AUROS_MIRROR="$MIRROR" ./tools/mirror-upstream.sh

      - name: Deterministic inputs
        id: sde
        run: |
          # Same commit in, same timestamps out. Without this the two builds differ in `created` and
          # in every file mtime, and S7 would be measuring the clock rather than the build.
          SDE=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=$SDE" >> "$GITHUB_ENV"
          echo "source_date_epoch=$SDE" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$SDE ($(date -u -d @"$SDE" +%FT%TZ))"

      - name: Build and flatten, twice
        id: s7
        env:
          BASE_REF: ${{ needs.plan.outputs.base_ref }}
        run: |
          # D2 + D11: we flatten at publish with `rpm-ostree compose build-chunked-oci --bootc`, so
          # that packages a customer's recipe removed are bytes they never download. If the flatten
          # step fails, the build fails. Publishing an unflattened image would leave the product's
          # central claim ("we removed 214 packages") true on disk and false on the wire.
          # BASE_REF USED TO BE PASSED AS `--build-arg BASE_IMAGE=…` AND DID NOTHING.
          # Containerfile declares only UPSTREAM_IMAGE / UPSTREAM_TAG / UPSTREAM_DIGEST /
          # SOURCE_DATE_EPOCH, and its FROM is a hardcoded literal on purpose (Containerfile lines
          # 30-31: written as a literal so the digest is greppable without evaluating build args).
          # podman warns about an unused build-arg and carries on, so the flag looked like the D21
          # mirror switch and was inert — "looks configured, isn't", which is the thing D22 is about.
          #
          # The flag is gone. The mirror flip is what it always actually was: an edit to the FROM
          # line, which `tools/resolve-upstream.sh assert` reads and reports as base_via. So BASE_REF
          # now GATES the build instead of decorating it — if the Containerfile's FROM is not the
          # reference the resolver just proved against base.lock, nothing is built.
          CF_FROM=$(grep -m1 -E '^FROM[[:space:]]' Containerfile | awk '{print $2}')
          if [ "$CF_FROM" != "$BASE_REF" ]; then
            echo "::error::Containerfile's FROM is not the reference the resolver just proved against base.lock."
            echo "  resolver: ${BASE_REF}"
            echo "  FROM:     ${CF_FROM}"
            echo "  Flipping to the D21 mirror is an edit to THAT line; no build argument does it."
            exit 1
          fi
          echo "FROM matches the resolved base reference: ${BASE_REF}"

          build_one () {
            local n="$1" raw="localhost/auros-base:raw-$1" out="localhost/auros-base:chunked-$1"
            echo "::group::build $n — derive"
            # --no-cache, and then PROVE it: run 35557609009 served all 29 of build b's steps from
            # build a's layer cache, so S7 compared an image with itself and reported PASS.
            sudo podman build --no-cache \
              --timestamp "$SOURCE_DATE_EPOCH" \
              -t "$raw" -f Containerfile . 2>&1 | tee "/tmp/build-$n.log"
            if grep -q 'Using cache' "/tmp/build-$n.log"; then
              echo "::error::build $n reused cached layers — S7 would compare an image with itself. Refusing."
              exit 1
            fi
            # Record the pre-flatten identity too. When S7 goes red at 2am, the first question is
            # whether the nondeterminism is in our build or in the chunker, and this answers it
            # without a second CI run.
            sudo skopeo inspect --config "containers-storage:$raw" | jq -c '.rootfs.diff_ids' > "/tmp/raw-$n.diffids"
            echo "::endgroup::"

            echo "::group::build $n — flatten (D11)"
            # This invocation is the one ublue-os/bazzite runs in production, VERBATIM in shape
            # (docs/evidence/research-dossiers.json, "What ublue-os ACTUALLY runs today #1"), rather
            # than one reconstructed from the man page.
            #
            # The previous version passed `--from "containers-storage:$raw"`. build-chunked-oci adds
            # the containers-storage: transport itself, so the reference arrived as
            # "containers-storage:containers-storage:localhost/auros-base:raw-a" and the step died
            # parsing it — one step AFTER the hardened image had built successfully for the first time.
            #
            # The proven shape differs in approach, not just the prefix: mount the raw image as a
            # filesystem, chunk it with --rootfs, write an oci-archive, then pull that back into
            # storage. Fewer moving parts than reading and writing the same container store from
            # inside a container that is itself running out of that store.
            RECHUNK_DIR="$(mktemp -d "${RUNNER_TEMP}/rechunk-XXXXXX")"
            sudo podman run --rm --pull=never --privileged \
              --mount=type=image,src="$raw",target=/rpm-ostree \
              --volume "${RECHUNK_DIR}:/run/out" \
              --entrypoint /usr/bin/rpm-ostree \
              "$raw" \
              compose build-chunked-oci --bootc --max-layers 127 --format-version 2 \
                --rootfs /rpm-ostree --output oci-archive:/run/out/chunked.oci
            chunked="$(sudo podman pull -q "oci-archive:${RECHUNK_DIR}/chunked.oci")"
            sudo podman tag "$chunked" "$out"
            sudo rm -rf "$RECHUNK_DIR"
            echo "::endgroup::"

            sudo skopeo inspect --config "containers-storage:$out" | jq -c '.rootfs.diff_ids' > "/tmp/chunked-$n.diffids"
            # The content digest. diff_ids are the sha256 of each UNCOMPRESSED layer, so this is an
            # identity of the filesystem itself — immune to compression settings and to the `created`
            # field, both of which vary for reasons that have nothing to do with what we built.
            sha256sum < "/tmp/chunked-$n.diffids" | cut -d' ' -f1 > "/tmp/chunked-$n.content"
            # NOT removed here. The S7 failure diagnostic inspects raw-a and raw-b to say WHY two
            # builds differ, and deleting them first made it report "PACKAGE SETS ARE IDENTICAL
            # (0 packages)" — a comparison of two empty lists, which is exactly the vacuous pass this
            # repository keeps finding. They are removed after the comparison instead; disk was
            # measured at ~110 GB free, and two raw images fit.
            df -h /
          }

          build_one a
          C_A=$(cat /tmp/chunked-a.content)
          build_one b
          C_B=$(cat /tmp/chunked-b.content)

          echo "content digest (build a): $C_A"
          echo "content digest (build b): $C_B"
          echo "content_digest=$C_A" >> "$GITHUB_OUTPUT"

          if [ "$C_A" = "$C_B" ]; then
            echo "s7=pass" >> "$GITHUB_OUTPUT"
            echo "S7 PASS — same recipe + same pinned base digest => same content digest"
          else
            echo "s7=fail" >> "$GITHUB_OUTPUT"
            echo "::error::S7 FAIL — two builds from identical inputs produced different content"
            echo "--- pre-flatten diff (is it us, or the chunker?) ---"
            diff <(tr ',' '\n' < /tmp/raw-a.diffids) <(tr ',' '\n' < /tmp/raw-b.diffids) || true
            echo "--- post-flatten diff ---"
            diff <(tr ',' '\n' < /tmp/chunked-a.diffids) <(tr ',' '\n' < /tmp/chunked-b.diffids) || true

            # NAME THE CAUSE, in this run. A digest mismatch with no explanation costs a
            # fifty-minute cycle per hypothesis, and there are at least two live ones:
            #   (a) dnf resolved DIFFERENT PACKAGES. pkg_ensure installs from live Fedora repos with
            #       no pinning, so two builds minutes apart can pick up a refreshed mirror.
            #   (b) the packages are identical and the FILES still differ — most likely the RPM
            #       database, which is a sqlite file with per-package install times and is not
            #       byte-reproducible by nature. 90-cleanup.sh already says so in a comment.
            # These need opposite fixes, so the run has to say which it is rather than leave it to
            # be guessed. Today four build cycles were lost to guessing.
            echo "--- (a) did dnf resolve the same packages? ---"
            for v in a b; do
              sudo podman run --rm --entrypoint= "localhost/auros-base:raw-$v" \
                rpm -qa --qf '%{NAME}-%{EPOCH}:%{VERSION}-%{RELEASE}.%{ARCH}\n' 2>/dev/null \
                | LC_ALL=C sort > "/tmp/pkgs-$v.txt" || echo "(could not read packages from raw-$v)"
            done
            NA=$(wc -l < /tmp/pkgs-a.txt 2>/dev/null | tr -d ' ' || echo 0)
            NB=$(wc -l < /tmp/pkgs-b.txt 2>/dev/null | tr -d ' ' || echo 0)
            if [ "${NA:-0}" -lt 100 ] || [ "${NB:-0}" -lt 100 ]; then
              # A Fedora KDE image has thousands of packages. Fewer than a hundred means the read
              # failed, not that the image is small — and "identical" computed from two empty lists is
              # the vacuous pass this diagnostic exists to avoid producing.
              echo "::error::could not read package sets (a=${NA}, b=${NB}). DRAWING NO CONCLUSION."
              echo "The images may have been removed before this step, or the entrypoint override failed."
              sudo podman images --format '{{.Repository}}:{{.Tag}}' | head -20
            elif diff -q /tmp/pkgs-a.txt /tmp/pkgs-b.txt >/dev/null 2>&1; then
              echo "PACKAGE SETS ARE IDENTICAL (${NA} packages)."
              echo "So the cause is (b): identical packages, different bytes. Look below for which files."
            else
              echo "::error::PACKAGE SETS DIFFER — dnf resolved differently between two builds in one run."
              echo "That is cause (a): the install list is not pinned and the repos moved underneath us."
              diff /tmp/pkgs-a.txt /tmp/pkgs-b.txt | head -40 || true
            fi

            echo "--- (b) which files differ? CONTENT hashes, not path/size/mtime ---"
            # The previous version listed path/size/mtime from inside a running container. --timestamp
            # pins every mtime and a same-size rewrite (a sqlite page, a cache) keeps its size, so it
            # could not see the most likely cause at all; and a running container adds /etc/hostname
            # and friends, which differ per container. So: mount each image from the host and hash
            # every regular file. Run 35548421189 showed only ONE layer differs pre-flatten — the
            # step-14 RUN that executes build/*.sh — so every path listed here comes from that step.
            manifest () {  # manifest <image> <prefix> — writes <prefix>.sha and <prefix>.meta
              local mnt
              mnt="$(sudo podman image mount "$1")" || { echo "(could not mount $1)"; return 1; }
              sudo bash -c 'cd "$1" && find . -xdev -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum' _ "$mnt" > "$2.sha" || true
              sudo bash -c 'cd "$1" && find . -xdev -printf "%y %m %U:%G %T@ %p -> %l\n" | LC_ALL=C sort -k5' _ "$mnt" > "$2.meta" || true
              sudo podman image unmount "$1" >/dev/null 2>&1 || true
            }
            manifest localhost/auros-base:raw-a /tmp/tree-a
            manifest localhost/auros-base:raw-b /tmp/tree-b
            FA=$(wc -l < /tmp/tree-a.sha 2>/dev/null | tr -d ' ' || echo 0)
            FB=$(wc -l < /tmp/tree-b.sha 2>/dev/null | tr -d ' ' || echo 0)
            if [ "${FA:-0}" -lt 1000 ] || [ "${FB:-0}" -lt 1000 ]; then
              echo "::error::hashed only a=${FA}, b=${FB} files — the images were not readable. NO CONCLUSION."
            else
              { diff /tmp/tree-a.sha /tmp/tree-b.sha || true; } | sed -nE 's/^[<>] [0-9a-f]{64}  //p' \
                | LC_ALL=C sort -u > /tmp/tree-diff.txt
              ND=$(wc -l < /tmp/tree-diff.txt | tr -d ' ')
              echo "(hashed ${FA} / ${FB} files) ${ND} paths differ in CONTENT or exist in only one build:"
              head -80 /tmp/tree-diff.txt || true
              echo "--- by directory ---"
              { sed 's#/[^/]*$##' /tmp/tree-diff.txt | LC_ALL=C sort | uniq -c | sort -rn || true; } | head -25 || true
              { diff /tmp/tree-a.meta /tmp/tree-b.meta || true; } | sed -nE 's/^[<>] [^ ]+ [^ ]+ [^ ]+ [^ ]+ (.*) -> .*$/\1/p' \
                | LC_ALL=C sort -u > /tmp/meta-diff.txt
              echo "--- $(wc -l < /tmp/meta-diff.txt | tr -d ' ') paths differ in METADATA (type, mode, owner, mtime, link target), by directory ---"
              { sed 's#/[^/]*$##' /tmp/meta-diff.txt | LC_ALL=C sort | uniq -c | sort -rn || true; } | head -15 || true
              echo "--- first 20 metadata lines ---"
              { diff /tmp/tree-a.meta /tmp/tree-b.meta || true; } | grep -E '^[<>]' | head -20 || true
              if [ "$ND" = 0 ]; then
                echo "::warning::no file content differs, yet the layer digests do. Look at the metadata diff above (mtimes/modes/xattrs) — the difference is in the tar headers, not the files."
              fi
            fi
          fi

          # Now the raw images have served their purpose — the diagnostic above has read them.
          sudo podman rmi localhost/auros-base:raw-a localhost/auros-base:raw-b >/dev/null 2>&1 || true
          # Keep only build a. b has served its purpose and is 15 GB.
          sudo podman rmi localhost/auros-base:chunked-b >/dev/null 2>&1 || true
          df -h /

      - name: S7 fragment
        run: |
          mkdir -p fragments
          S7='${{ steps.s7.outputs.s7 }}'
          jq -n --arg st "$S7" --arg cd '${{ steps.s7.outputs.content_digest }}' '
            { profile: "static",
              checks: [ { id: "S7", status: $st,
                          detail: ("content digest " + $cd + " from two builds in one run") } ] }' \
            > fragments/s7.json
          cat fragments/s7.json

      - name: S1 fragment
        run: |
          # S1 was proven in the `plan` job. It is recorded here because the ledger is keyed by digest
          # and every check in checks.yaml has to appear in the results document for this digest.
          jq -n --arg r '${{ needs.plan.outputs.base_ref }}' '
            { profile: "static",
              checks: [ { id: "S1", status: "pass", detail: ("FROM pinned to " + $r) } ] }' \
            > fragments/s1.json

      - name: Stop here if S7 failed
        if: steps.s7.outputs.s7 != 'pass'
        run: |
          echo "Determinism is not a warning. Stopping before anything reaches the registry." >&2
          exit 1

      - name: Push the UNSIGNED staging tag
        id: push
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          sudo podman push --digestfile /tmp/digest \
            localhost/auros-base:chunked-a \
            "docker://${IMAGE}:${STAGE_TAG}"
          DIGEST=$(cat /tmp/digest)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "push produced no digest"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "stage_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| upstream base | \`${{ needs.plan.outputs.base_ref }}\` |"
            echo "| content digest (S7) | \`${{ steps.s7.outputs.content_digest }}\` |"
            echo "| staging digest | \`${DIGEST}\` |"
            echo "| staging tag | \`${IMAGE}:${STAGE_TAG}\` — unsigned, not installable |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fragments-build
          path: fragments/
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  static:
    name: static · S2-S6 S9 S10
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
      - name: Run the static check set
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p fragments
          sudo -E ./matrix/run.sh \
            --phase static \
            --image  '${{ needs.build.outputs.stage_ref }}' \
            --digest '${{ needs.build.outputs.digest }}' \
            --checks matrix/checks.yaml \
            --profiles matrix/profiles.yaml \
            --out fragments/static.json
          # Fail closed on a harness that exits 0 without producing anything.
          jq -e '.profile and (.checks|length > 0)' fragments/static.json >/dev/null
          jq -r '.checks[] | "\(.id) \(.status) \(.detail // "")"' fragments/static.json
      - uses: actions/upload-artifact@v4
        with: { name: fragments-static, path: fragments/, if-no-files-found: error }

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  boot:
    name: boot · ${{ matrix.profile }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false   # one profile failing must not hide what the other six would have said
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Reclaim disk, enable KVM, install QEMU
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          # Measured in the runner probe: /dev/kvm is present and becomes writable after chmod.
          sudo chmod 666 /dev/kvm || true
          # NOT "will run under TCG, slower". run-boot.sh REFUSES without a writable /dev/kvm unless
          # AUROS_ALLOW_TCG=1, because a silent fall back to emulation would quietly stop enforcing
          # B1's 120-second budget — the check would still go green while measuring nothing. Saying
          # "slower" here would send whoever debugs this looking for a timeout instead of a refusal.
          ls -l /dev/kvm || echo "::error::no writable /dev/kvm. The boot harness will REFUSE rather than fall back to emulation, because TCG would silently void B1's 120s budget."
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools
          qemu-system-x86_64 --version | head -1
          df -h /
      - name: Boot checks B1-B12 on ${{ matrix.profile }}
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p fragments
          sudo -E ./matrix/run.sh \
            --phase boot \
            --profile '${{ matrix.profile }}' \
            --image  '${{ needs.build.outputs.stage_ref }}' \
            --digest '${{ needs.build.outputs.digest }}' \
            --checks matrix/checks.yaml \
            --profiles matrix/profiles.yaml \
            --out "fragments/boot-${{ matrix.profile }}.json"
          jq -e '.profile == "${{ matrix.profile }}" and (.checks|length > 0)' "fragments/boot-${{ matrix.profile }}.json" >/dev/null
          jq -r '.checks[] | "\(.id) \(.status) \(.detail // "")"' "fragments/boot-${{ matrix.profile }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fragments-boot-${{ matrix.profile }}
          path: fragments/
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  sign:
    name: sign · S8 signature is discoverable
    needs: [plan, build, static, boot]
    if: needs.plan.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # No `id-token: write`. Signing is KEYED — signing/policy.json enforces
      # keyPath=/usr/lib/pki/containers/auros.pub — so there is no OIDC token to mint.
    env:
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Read signing/cosign.lock — the only place a cosign version is written
        id: cosign
        run: |
          # Measured by the signing owner on 2026-09-20 by reading cmd/cosign/cli/options/sign.go at
          # each tag: v2.6.5 defaults --new-bundle-format to FALSE and is not deprecated, while
          # v3.1.3 defaults it to TRUE and carries "this will be the only supported format in future
          # versions". containers/image — what podman and bootc use on the customer's laptop —
          # cannot read new-format OCI 1.1 referrer bundles (containers/container-libs#388, open
          # since 2025-10-12). On the v3 line every signature we make is invisible to the machine
          # that has to verify it unless a deprecated flag is passed on every invocation, and
          # `cosign verify` keeps passing throughout. Pinning to 2.6 makes the format we need the
          # default rather than an override we are one forgotten flag away from losing.
          set -a; . signing/cosign.lock; set +a
          : "${COSIGN_VERSION:?signing/cosign.lock has no COSIGN_VERSION}"
          echo "version=${COSIGN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "flag=${COSIGN_BUNDLE_FORMAT_FLAG:-}" >> "$GITHUB_OUTPUT"
          echo "pubkey_in_image=${COSIGN_PUBKEY_IN_IMAGE:-}" >> "$GITHUB_OUTPUT"
          # `uses:` cannot be an expression, so the action ref below is written out. This is the
          # assertion that stops it drifting from the lock silently.
          WANT="sigstore/cosign-installer@v4.1.2"
          if [ "${COSIGN_INSTALLER_ACTION:-$WANT}" != "$WANT" ]; then
            echo "::error::signing/cosign.lock names ${COSIGN_INSTALLER_ACTION}, but build.yml pins ${WANT}. Update the uses: line in build.yml and gate1-exit.yml to match the lock."
            exit 1
          fi

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}

      - name: Sign the digest with the key the image trusts
        id: key
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          AUROS_DEV_SIGNING_KEY: ${{ secrets.AUROS_DEV_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # KEYED, NOT KEYLESS — and this is deliberate, against an earlier instruction to use
          # keyless OIDC. `signing/policy.json` is what a customer's laptop enforces, and it says:
          #
          #     "type": "sigstoreSigned", "keyPath": "/usr/lib/pki/containers/auros.pub"
          #
          # A keyless signature carries a Fulcio certificate, not that key. The machine would find
          # no signature matching `auros.pub`, refuse every update forever, and do it at 3am in a
          # school months after anyone remembered why. The image's policy decides the signing
          # method; CI does not get a vote. If we ever want keyless, `policy.json` changes first and
          # every machine in the field has to install an image containing the new policy before it
          # takes effect (see signing/keys/README.md on rotation — same ordering problem).
          #
          # D32: the PRODUCTION key if signing/keys/auros.pub is committed, else the DEVELOPMENT key
          # (AUROS_DEV_SIGNING_KEY) — the same rule build/30-update-agent.sh uses to pick the key the
          # image ships, and no fallback across kinds. The script also proves the private key matches
          # that public key BEFORE signing: a wrong key makes a valid signature every machine rejects,
          # and S8 would still pass. A development-signed digest is refused at publish, not here.
          # cosign prompts unless COSIGN_PASSWORD is SET; empty is a valid password (the dev key has none).
          export COSIGN_PASSWORD="${COSIGN_PASSWORD-}"
          cosign version
          tools/signing-key.sh prepare /tmp/auros.key

          # D17 belt and braces: on the pinned 2.6 line this flag is already the default, but
          # passing it explicitly documents the intent at the call site and survives a version bump.
          FLAG='${{ steps.cosign.outputs.flag }}'
          if [ -n "$FLAG" ] && ! cosign sign --help 2>&1 | grep -q -- "${FLAG%%=*}"; then
            echo "::warning::this cosign has no ${FLAG%%=*} flag; relying on S8 to prove the signature is still discoverable"
            FLAG=""
          fi
          COSIGN_YES=true cosign sign $FLAG --key /tmp/auros.key "${IMAGE}@${DIGEST}"
          shred -u /tmp/auros.key 2>/dev/null || rm -f /tmp/auros.key

      - name: S8 — cosign verify AND skopeo can find the .sig tag
        id: s8
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p fragments
          ok=1; detail=""

          # Half one. Necessary, and on its own worthless: it passed right through the cosign 3.x
          # regression while no consumer could see a signature. Verified against the SAME public key
          # the image ships, because that is the only key a customer machine will try.
          PUB='${{ steps.key.outputs.pub }}'
          [ -n "$PUB" ] || { echo "::error::the signing step reported no public key"; exit 1; }
          if cosign verify --key "$PUB" "${IMAGE}@${DIGEST}" > /tmp/cosign-verify.txt 2>&1; then
            detail="cosign verify ok against $PUB (${{ steps.key.outputs.kind }} key)"
          else
            ok=0; detail="cosign verify FAILED"
            cat /tmp/cosign-verify.txt
          fi

          # Half two, and the one that actually represents a customer's laptop. The legacy
          # attachment lives at the tag `sha256-<hex>.sig`. If skopeo cannot see it, neither can
          # bootc, and the failure is SILENT.
          SIGTAG="${DIGEST/:/-}.sig"
          if skopeo inspect --raw "docker://${IMAGE}:${SIGTAG}" > /tmp/sigtag.json 2>/tmp/sigtag.err; then
            detail="$detail; .sig tag ${SIGTAG} discoverable ($(jq '.layers|length' /tmp/sigtag.json) layer(s))"
          else
            ok=0
            detail="$detail; .sig tag ${SIGTAG} NOT discoverable by skopeo — a customer machine cannot verify this image"
            cat /tmp/sigtag.err
          fi

          ST=fail; [ "$ok" = "1" ] && ST=pass
          jq -n --arg st "$ST" --arg d "$detail" \
            '{profile:"static", checks:[{id:"S8", status:$st, detail:$d}]}' > fragments/s8.json
          cat fragments/s8.json
          echo "$detail"
          [ "$ok" = "1" ] || { echo "::error::S8 FAIL — $detail"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: fragments-sign, path: fragments/, if-no-files-found: error }

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  update:
    name: update · U1-U5 R1
    needs: [plan, build, sign]
    if: needs.plan.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Read signing/cosign.lock
        id: cosign
        run: |
          set -a; . signing/cosign.lock; set +a
          echo "version=${COSIGN_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ steps.cosign.outputs.version }}
      - name: Reclaim disk, enable KVM, install QEMU
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          # run-update.sh refuses to run without a writable /dev/kvm unless AUROS_ALLOW_TCG=1, and
          # it is right to: the update group is four boots and would take hours under emulation.
          # We do NOT set AUROS_ALLOW_TCG. A six-hour job that times out proves nothing.
          sudo chmod 666 /dev/kvm || true
          [ -w /dev/kvm ] || echo "::warning::/dev/kvm is not writable; the update group will fail closed rather than run under TCG"
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf
          df -h /

      - name: Update and rollback checks
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          AUROS_DEV_SIGNING_KEY: ${{ secrets.AUROS_DEV_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # The harness stands up its own registry on the host, serves the image under the name the
          # in-image policy is scoped to, and mints the old/new/bad variants itself. All it needs
          # from CI is the image under test and the PRIVATE half of the key the image ships at
          # /usr/lib/pki/containers/auros.pub — without which it can only offer unsigned images,
          # which would let U4 pass while U1 fails, i.e. the exact opposite of proving anything.
          # Same key, same rule as the sign job (tools/signing-key.sh, D32): production if committed,
          # else the development key. run-update.sh signs with it under this step's COSIGN_PASSWORD
          # (sudo -E keeps it), which is the password prepare encrypted it with.
          tools/signing-key.sh prepare /tmp/auros.key
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p fragments
          # `--profile uefi-modern` so the fragment lands under a REAL profile rather than the
          # synthetic "update" bucket. matrix/profiles.yaml calls uefi-modern the always-bound
          # baseline, and run-update.sh already defaults to it internally.
          set +e
          sudo -E ./matrix/run.sh \
            --phase update \
            --profile uefi-modern \
            --image  '${{ needs.build.outputs.stage_ref }}' \
            --digest '${{ needs.build.outputs.digest }}' \
            --checks matrix/checks.yaml \
            --profiles matrix/profiles.yaml \
            --out fragments/update.json \
            -- --signing-key /tmp/auros.key
          rc=$?
          set -e
          shred -u /tmp/auros.key 2>/dev/null || rm -f /tmp/auros.key
          # A non-zero harness still writes a fragment recording WHICH checks failed, and that
          # fragment is what the gate reads. Re-raise after capturing it, never instead of.
          jq -e '.profile and (.checks|length > 0)' fragments/update.json >/dev/null
          jq -r '.checks[] | "\(.id) \(.status) \(.detail // "")"' fragments/update.json
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: fragments-update, path: fragments/, if-no-files-found: error }

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # record — the job that WRITES the evidence. It cannot publish: no `packages: write`, no registry
  # login, no cosign key, no skopeo. Its only product is a commit in the meta/control repo.
  #
  # WHY THIS IS A SEPARATE JOB, because it looks like ceremony and is not.
  # Recording and gating used to be two steps of the publish job, nine lines apart: step one wrote
  # the pass into `meta/attest/passed-digests.tsv`, step two read that same file, on the same runner,
  # out of the same checkout, and called it the gate. The evidence was manufactured by the job being
  # gated. Passing `--ledger` changed nothing, because it named the file the previous step had just
  # written. A gate whose input its own subject produces is a formality with a green tick on it.
  #
  # So: this job writes, and cannot publish. The publish job reads from a FRESH clone of the control
  # repo and cannot write. Neither can do the other's half, and the evidence has to survive a push
  # and a fetch in between — which is also the only form of it that is still there tomorrow.
  record:
    name: record · write the pass to the control repo
    needs: [plan, build, static, boot, sign, update]
    if: needs.plan.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # DELIBERATELY NO `packages: write`. This job must not be able to reach the registry at all.
    outputs:
      ledger_commit: ${{ steps.commit.outputs.ledger_commit }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.CHECKOUT_REF }}" }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.META_REPO }}
          path: meta
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: fragments-*
          path: frag-raw
          merge-multiple: true

      - name: Assemble results.json
        id: results
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          ls -la frag-raw
          shopt -s nullglob
          FRAGS=(frag-raw/*.json)
          [ ${#FRAGS[@]} -gt 0 ] || { echo "::error::no result fragments — nothing to gate on"; exit 1; }

          # Fragments are {profile, checks[]}. Several legs write under "uefi-modern" (it is the
          # always-bound profile, per matrix/profiles.yaml), so group by profile and concatenate.
          jq -s \
            --arg digest "$DIGEST" \
            --arg image  "$IMAGE" \
            --argjson mv ${{ needs.plan.outputs.matrix_version }} \
            --arg started  "${{ github.event.repository.updated_at }}" \
            --arg finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '
            {
              digest: $digest, image: $image, recipe: null,
              matrix_version: $mv,
              started_at: $started, finished_at: $finished, run_url: $run,
              profiles: ( group_by(.profile)
                          | map({ profile: .[0].profile, checks: (map(.checks) | add) }) ),
              verdict: ( if ([.[].checks[].status] | all(. == "pass")) then "pass" else "fail" end )
            }' "${FRAGS[@]}" > results.json

          jq . results.json
          echo "--- every check, flat ---"
          jq -r '.profiles[] | .profile as $p | .checks[] | "\($p)\t\(.id)\t\(.status)"' results.json | sort

      - name: The assembled verdict must be a pass, asserted here and not only inside the recorder
        run: |
          # Two independent readers of the same document. record-pass.mjs RECOMPUTES the verdict and
          # ignores this field — which is right, and which also means nothing was ever asserting the
          # field itself. If these two ever disagree, one of them is broken and we want to know at
          # the moment it happens rather than to discover which one we were trusting.
          if ! jq -e '.verdict == "pass"' results.json >/dev/null; then
            echo "::error::the assembled results.json says verdict=$(jq -r .verdict results.json). Nothing is recorded and nothing is published."
            jq -r '.profiles[] | .profile as $p | .checks[] | select(.status != "pass") | "  \($p)\t\(.id)\t\(.status)\t\(.detail // "")"' results.json
            exit 1
          fi
          # …and a document with no checks in it would satisfy `all` vacuously, so count them.
          N=$(jq '[.profiles[].checks[]] | length' results.json)
          P=$(jq '.profiles | length' results.json)
          echo "assembled: ${P} profile(s), ${N} check record(s), verdict=pass"
          [ "$N" -ge 28 ] || { echo "::error::only ${N} check records. jq's all() on an empty list is true, so this would not be evidence of anything."; exit 1; }

      - name: Put the matrix definition where the gate looks for it
        run: |
          # tools/gate.mjs resolves its paths from ITS OWN location, never from the working directory
          # — which is the property that stops the ledger being redirected by an argument. The side
          # effect is that it looks for the matrix at meta/auros-base/matrix/, and auros-base is
          # gitignored from the meta repo (D6), so driftCheck() finds nothing and returns "no drift"
          # without ever comparing anything. Copying the real matrix in makes that check live: the
          # gate now actually compares checks.yaml and profiles.yaml against its own constants and
          # refuses every digest when they disagree.
          mkdir -p meta/auros-base/matrix
          cp matrix/checks.yaml matrix/profiles.yaml meta/auros-base/matrix/
          echo "matrix_version in checks.yaml: $(grep -E '^matrix_version:' matrix/checks.yaml)"

      - name: Record the pass in the ledger
        run: |
          # record-pass.mjs recomputes the verdict from the checks array, derives the bound profile
          # set itself rather than trusting the harness's claim, imports the ledger's column set from
          # tools/gate.mjs, and shows the row to gate.decide() on a scratch copy before appending.
          # If the gate would refuse the row, nothing is written.
          node matrix/run/record-pass.mjs \
            --results results.json \
            --ledger  "$PWD/meta/attest/passed-digests.tsv"

          # Belt and braces: the row must actually be in the file now.
          grep -qF "${{ needs.build.outputs.digest }}" meta/attest/passed-digests.tsv || {
            echo "::error::record-pass.mjs exited 0 but wrote no row for ${{ needs.build.outputs.digest }}"; exit 1; }

      - name: Commit the row to the control repo — this is the durable evidence
        id: commit
        env:
          DISPATCH_TOKEN: ${{ secrets.AUROS_DISPATCH_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          # THIS IS NOW FATAL, AND THAT IS A CHANGE. It used to end in "never fail the build over it",
          # which was defensible only while the publish gate read the local file — i.e. while the
          # push was decoration. Now the publish job reads the ledger back out of this repository, so
          # a row that was not pushed is a row no gate will ever see, and a publish that proceeded
          # anyway would be a publish gated on nothing.
          #
          # D18: the default GITHUB_TOKEN is issued for auros-base and cannot write to
          # aarohkandy/auros. A PAT or GitHub App token is required. Until that secret exists, this
          # pipeline builds, tests, signs — and does not publish. That is the intended behaviour, not
          # an outage: see BLOCKED.md B2 and signing/README.md "what is not yet measured".
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::error::AUROS_DISPATCH_TOKEN is not set, so the pass cannot be written to ${META_REPO}."
            echo "The publish gate reads the COMMITTED ledger from a fresh clone of that repository —"
            echo "deliberately, so that the job producing the evidence is not the job consuming it."
            echo "Without the token there is no durable evidence, so there is no publish. (D18, BLOCKED.md B2)"
            exit 1
          fi
          cd meta
          git config user.name  "auros-ci"
          git config user.email "auros-ci@users.noreply.github.com"
          git add attest/passed-digests.tsv
          if git diff --cached --quiet; then
            echo "ledger already contains this row at $(git rev-parse HEAD); nothing to commit"
          else
            git commit \
              -m "attest: ${DIGEST} passed matrix v${{ needs.plan.outputs.matrix_version }}" \
              -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          REMOTE="https://x-access-token:${DISPATCH_TOKEN}@github.com/${META_REPO}.git"
          # A concurrent run may have appended its own row. Rebase and retry rather than clobbering
          # someone else's evidence; give up loudly rather than forcing.
          pushed=0
          for attempt in 1 2 3; do
            if git push "$REMOTE" HEAD:main; then pushed=1; break; fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main and retrying"
            git fetch "$REMOTE" main && git rebase FETCH_HEAD || { git rebase --abort || true; break; }
          done
          [ "$pushed" = "1" ] || { echo "::error::could not push the ledger row to ${META_REPO}. No durable evidence, no publish."; exit 1; }
          SHA=$(git rev-parse HEAD)
          echo "ledger_commit=${SHA}" >> "$GITHUB_OUTPUT"
          echo "ledger row committed as ${SHA} on ${META_REPO}@main"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_id }}
          path: |
            results.json
            meta/attest/passed-digests.tsv
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # publish — the job that READS the evidence and moves the tag. It holds `packages: write` and no
  # way to write the ledger: it never downloads the fragments, never sees results.json, and the only
  # copy of the control repo it has is a fresh clone it re-fetches from origin before gating.
  publish:
    name: publish · gated on the committed ledger
    needs: [plan, build, record]
    if: needs.plan.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.promote.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.CHECKOUT_REF }}" }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.META_REPO }}
          path: meta
          ref: main

      - name: Re-fetch the ledger from origin and prove it carries the recorded commit
        env:
          LEDGER_COMMIT: ${{ needs.record.outputs.ledger_commit }}
        run: |
          # `actions/checkout` above already cloned at main, but it may have been scheduled before
          # the record job's push landed. Fetch again and hard-reset, so the bytes the gate reads are
          # unambiguously what is on the default branch of the control repo right now.
          cd meta
          git fetch --no-tags origin main
          git reset --hard FETCH_HEAD
          echo "meta is at $(git rev-parse HEAD) on ${META_REPO}@main"

          [ -n "${LEDGER_COMMIT:-}" ] || { echo "::error::the record job reported no ledger commit"; exit 1; }
          # `merge-base --is-ancestor` answers the question that matters: is the commit that carries
          # this digest's row actually reachable from the branch everyone else reads?
          if ! git merge-base --is-ancestor "$LEDGER_COMMIT" HEAD; then
            echo "::error::${LEDGER_COMMIT} (the commit that recorded this pass) is not an ancestor of ${META_REPO}@main."
            echo "Either the push did not land or the branch moved under us. The gate is not run against evidence we cannot locate."
            exit 1
          fi
          echo "ledger commit ${LEDGER_COMMIT} is on main"

      - name: Put the matrix definition where the gate looks for it
        run: |
          # Same reason as in the record job: without this, gate.mjs's drift check finds no matrix
          # and silently returns "no drift", and a gate whose check cannot fail is not a check (D19).
          mkdir -p meta/auros-base/matrix
          cp matrix/checks.yaml matrix/profiles.yaml meta/auros-base/matrix/

      - name: Negative control — the gate must still refuse a digest nobody recorded
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          # D19: "a step that cannot fail is not a check. When adding any gate, the first question is
          # what would make this go red." This is that question, answered on every single publish,
          # against the same binary and the same argv shape the real gate uses one step below.
          #
          # It catches two different disasters:
          #   exit 0 — the gate allows a digest with no recorded pass. The gate is broken open.
          #   exit 2 — the gate could not parse this invocation. That is how the previous version of
          #            this workflow failed: it called `gate.mjs check --digest …`, a subcommand that
          #            has never existed, so the step died before the gate ran and the publish was
          #            fail-closed only by accident. An accident is not a gate.
          SENTINEL="sha256:$(printf '0%.0s' $(seq 1 64))"
          set +e
          node meta/tools/gate.mjs "$SENTINEL" --image "$IMAGE"
          rc=$?
          set -e
          case "$rc" in
            1) echo "negative control OK — the gate refused an unrecorded digest, exit 1" ;;
            0) echo "::error::THE GATE ALLOWED A DIGEST THAT WAS NEVER TESTED (${SENTINEL}). Refusing to publish anything."; exit 1 ;;
            *) echo "::error::the gate exited ${rc} on a well-formed invocation — it could not decide, so it has not passed anything. Check that this workflow and tools/gate.mjs agree on the command line."; exit 1 ;;
          esac

      - name: A development-key image may never reach a customer-facing tag
        env:
          STAGE_REF: ${{ needs.build.outputs.stage_ref }}
        run: |
          # The build accepts a DEVELOPMENT key so that Gate 1 — "builds in CI and boots in a VM" —
          # is not blocked on a human minting a long-lived organisational credential. That is the
          # right trade for testing and the wrong one for shipping, so the two are separated HERE,
          # at the only step that makes an image reachable by a machine.
          #
          # The answer is read back OUT OF THE BUILT IMAGE, not from a workflow variable. A variable
          # can be set by whoever edits the workflow; a file inside the artifact travels with the
          # thing being judged. Same reasoning as the gate recomputing its verdict instead of reading
          # the harness's `verdict` field.
          #
          # The kind file alone is a filename test (docs/SYSTEM-REVIEW.md §2.14), so the KEY the image
          # ships is checked too: never the development key (fingerprint pinned in the script), and
          # exactly the production key committed in this checkout.
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull -q "$STAGE_REF"
          sudo podman run --rm --entrypoint= "$STAGE_REF" cat /usr/lib/auros/signing-key-kind > /tmp/image.kind || : > /tmp/image.kind
          sudo podman run --rm --entrypoint= "$STAGE_REF" cat /usr/lib/pki/containers/auros.pub > /tmp/image.pub || : > /tmp/image.pub
          tools/signing-key.sh publish-check /tmp/image.kind /tmp/image.pub

      - name: THE GATE
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          # Spec §4.3. One command, no flags that can change its answer, reading a ledger whose path
          # gate.mjs derives from its own location rather than from anything on this line. The
          # evidence it reads was committed by a different job, with different permissions, and
          # fetched from origin in the step above. If this exits non-zero the tag does not move.
          node meta/tools/gate.mjs "$DIGEST" --image "$IMAGE"
          echo "gate: PASS for ${DIGEST}"

      - name: Promote to :hardened
        id: promote
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "${{ github.token }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Promotion is a tag move against a digest that is already signed and already recorded. No
          # bytes are rebuilt here, so nothing can differ between what was tested and what ships.
          for TAG in hardened "$(date -u +%Y-%m-%d)" "${GITHUB_SHA::12}"; do
            skopeo copy --all "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:${TAG}"
            echo "tagged ${IMAGE}:${TAG}"
          done
          skopeo inspect --no-tags "docker://${IMAGE}:hardened" | jq -r '"hardened now points at \(.Digest)"'
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          {
            echo "## published"
            echo ""
            echo "- image: \`${IMAGE}:hardened\`"
            echo "- digest: \`${{ needs.build.outputs.digest }}\`"
            echo "- upstream base: \`${{ needs.plan.outputs.base_ref }}\`"
            echo "- matrix version: ${{ needs.plan.outputs.matrix_version }}"
            echo "- evidence: \`${META_REPO}@${{ needs.record.outputs.ledger_commit }}\` — committed by the \`record\` job, fetched from origin by this one"
            echo "- gate: \`node meta/tools/gate.mjs <digest> --image <image>\` exited 0, after refusing a control digest"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  cleanup:
    name: cleanup staging tags
    needs: [plan, build, static, boot, sign, update, record, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete this run's staging tag
        env:
          GH_TOKEN: ${{ secrets.AUROS_DISPATCH_TOKEN || github.token }}
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          # THIS USED TO BE `echo "would remove tag ${T}"`, which is not a cleanup job, it is a
          # picture of one. D19: a step that cannot fail is not a check, and a step that cannot act
          # is not an action. So it now actually calls the API, reports exactly what the registry
          # said, and leaves a warning in the run when it could not delete — rather than a notice
          # asserting an outcome nobody attempted.
          PKG="${IMAGE##*/}"                 # ghcr.io/<org>/<name> -> <name>
          ORG="${IMAGE%/*}"; ORG="${ORG##*/}"

          # Find the package version whose tags include our staging tag. A version id is required;
          # GHCR has no delete-by-tag endpoint.
          if ! gh api --paginate \
                "/orgs/${ORG}/packages/container/${PKG}/versions" > /tmp/versions.json 2>/tmp/versions.err \
             && ! gh api --paginate \
                "/users/${ORG}/packages/container/${PKG}/versions" > /tmp/versions.json 2>>/tmp/versions.err; then
            echo "::warning::could not list versions of ${IMAGE}; the staging tag ${STAGE_TAG} stays. It is unsigned and cannot be installed."
            sed -n '1,20p' /tmp/versions.err
            exit 0
          fi

          ID=$(jq -r --arg t "${STAGE_TAG}" '.[] | select(.metadata.container.tags // [] | index($t)) | .id' /tmp/versions.json | head -1)
          if [ -z "${ID:-}" ] || [ "$ID" = "null" ]; then
            echo "no package version is tagged ${STAGE_TAG} — nothing to delete"
            exit 0
          fi

          for SCOPE in "orgs/${ORG}" "users/${ORG}"; do
            if gh api -X DELETE "/${SCOPE}/packages/container/${PKG}/versions/${ID}" >/dev/null 2>/tmp/del.err; then
              echo "deleted ${IMAGE}:${STAGE_TAG} (version ${ID})"
              exit 0
            fi
          done
          echo "::warning::could not delete ${IMAGE}:${STAGE_TAG} (version ${ID}) — the token lacks delete:packages. The tag stays; it is unsigned and cannot be installed, but it does accumulate."
          sed -n '1,20p' /tmp/del.err

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  keep-nightly-enabled:
    # GitHub disables a scheduled workflow on a PUBLIC repo after 60 days of repository inactivity,
    # and a disabled workflow cannot re-enable itself — by definition it is not running. So the job
    # that re-enables it has to live somewhere that runs on a push. That is here.
    #
    # This job has `actions: write` and nothing else. It cannot build, sign, tag or publish. It is
    # listed in the no-bypass audit at the top of this file for exactly that reason.
    name: keep the nightly schedule alive
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A no-op while the workflow is enabled, which is the point: it costs nothing and closes the
          # window where a push happens after the nightly was silently switched off.
          if gh api --method PUT \
              "repos/${{ github.repository }}/actions/workflows/nightly.yml/enable" >/dev/null 2>&1; then
            echo "nightly.yml is enabled"
          else
            echo "::warning::could not confirm nightly.yml is enabled — check the Actions tab. See CI.md, 'the 60-day rule'."
          fi
