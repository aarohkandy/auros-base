# PROBE 2 — the Gate 1 exit path, end to end, on a free runner.
#   derived image -> bootc-image-builder -> qcow2 -> QEMU boot -> does it reach a login prompt?
#
# Revision 2. The first attempt failed for two reasons, both worth recording:
#   1. Moving podman's graphroot to /mnt broke bootc-image-builder: it mounts the host store at
#      /var/lib/containers/storage, and podman inside the container then found a libpod DB whose
#      recorded static dir was /mnt/containers/libpod -> "database configuration mismatch". Probe 1
#      measured 104 GB free on / anyway, and on this runner /mnt is not even a separate volume, so the
#      move bought nothing and cost the build.
#   2. The build step piped through `tail -40`, so the pipeline's exit status was tail's. A FAILING
#      bootc-image-builder was scored as a passing step. `set -o pipefail` everywhere from now on —
#      this is precisely the class of error the check matrix exists to prevent, and it appeared in our
#      own probe within an hour of writing it.
name: probe-boot
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          echo "--- after reclaim ---"; df -h /

      - name: Enable KVM and install QEMU
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || echo "NO /dev/kvm"
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf
          qemu-system-x86_64 --version | head -1

      - name: Build a minimal derived image
        run: |
          cat > Containerfile <<'EOF'
          FROM ghcr.io/ublue-os/aurora:stable
          # NOTE: `ostree container commit` is NOT used. On this base it fails with
          # "Not in an ostree-based container environment" — it belongs to the older rpm-ostree
          # flow and is obsolete for bootc images. `bootc container lint` is the validation step.
          RUN echo "auros-probe" > /etc/auros-probe
          EOF
          time sudo podman build -t localhost/auros-probe:latest -f Containerfile .
          sudo podman images
          df -h /

      - name: bootc container lint
        continue-on-error: true
        run: sudo podman run --rm localhost/auros-probe:latest bootc container lint

      - name: bootc-image-builder -> qcow2
        run: |
          # A user we can actually log in as, so the boot check can prove more than "it reached a prompt".
          cat > config.toml <<'EOF'
          [[customizations.user]]
          name = "probe"
          password = "probe"
          groups = ["wheel"]

          # Rev 3 failed here with:
          #   "min-free-space-percent '3%' would be exceeded, at least 16.4 kB requested"
          # The image is 8.4 GB across 257 layers and the DEFAULT root filesystem bootc-image-builder
          # creates is too small for it — ostree refuses the write rather than filling the disk.
          # This is also a real product fact, not just a CI detail: it puts a hard floor under the
          # "minimum viable machine" assumption, and the small-disk test profile has to respect it.
          [[customizations.filesystem]]
          mountpoint = "/"
          minsize = "20 GiB"
          EOF
          mkdir -p output
          # The builder image must be pulled first — it no longer pulls for itself.
          sudo podman pull quay.io/centos-bootc/bootc-image-builder:latest
          # Host store stays at its default location: moving it is what broke revision 1.
          time sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/config.toml":/config.toml:ro \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs ext4 \
            localhost/auros-probe:latest
          echo "--- what was produced ---"
          sudo find output -type f -exec ls -lh {} \;
          df -h /

      - name: Boot the qcow2 and watch the serial console
        id: boot
        run: |
          QCOW=$(sudo find "$PWD/output" -name '*.qcow2' | head -1)
          if [ -z "$QCOW" ]; then echo "NO QCOW PRODUCED — stopping"; exit 1; fi
          echo "booting $QCOW"
          sudo chmod 666 "$QCOW"
          ACCEL=tcg; [ -w /dev/kvm ] && ACCEL=kvm
          echo "acceleration: $ACCEL"
          # UEFI needs writable NVRAM; without it the firmware cannot record a boot entry.
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/vars.fd 2>/dev/null || cp /usr/share/OVMF/OVMF_VARS.fd /tmp/vars.fd
          CODE=/usr/share/OVMF/OVMF_CODE_4M.fd; [ -f "$CODE" ] || CODE=/usr/share/OVMF/OVMF_CODE.fd
          set +e
          sudo qemu-system-x86_64 \
            -machine q35,accel=$ACCEL -cpu max -smp 4 -m 4096 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,unit=1,file=/tmp/vars.fd \
            -drive file="$QCOW",format=qcow2,if=virtio \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:/tmp/serial.log -monitor none &
          QPID=$!
          FOUND=0
          for i in $(seq 1 120); do
            sleep 10
            if sudo grep -qiE "login:|Reached target Graphical|Startup finished|sddm" /tmp/serial.log 2>/dev/null; then FOUND=1; break; fi
            if ! sudo kill -0 $QPID 2>/dev/null; then echo "qemu exited early after ${i} polls"; break; fi
          done
          echo "polls=$i found=$FOUND"
          sudo kill $QPID 2>/dev/null || true
          set -e
          echo "--- serial log, last 150 lines ---"
          sudo tail -150 /tmp/serial.log 2>/dev/null || echo "(no serial output at all)"
          sudo chmod 644 /tmp/serial.log 2>/dev/null || true
          echo "found=$FOUND" >> $GITHUB_OUTPUT
          {
            echo "## boot probe"
            echo "- acceleration: \`$ACCEL\`"
            echo "- polls (10s each): $i"
            echo "- login/startup marker observed: **$FOUND**"
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log
          path: /tmp/serial.log
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          df -h / >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.boot.outputs.found }}" = "1" ]; then
            echo "**GATE 1 PATH IS FEASIBLE ON FREE CI:** image -> qcow2 -> boot -> login prompt." >> $GITHUB_STEP_SUMMARY
          else
            echo "Boot marker NOT observed. Read the serial log artifact before concluding anything." >> $GITHUB_STEP_SUMMARY
          fi
