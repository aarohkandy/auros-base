# KDE Kiosk -- action restrictions for policy mode LOCKED.
#
# `[$i]` makes the group immutable: a user's ~/.config/kdeglobals cannot override it.
#
# action/shell_access is the one that matters. It removes the terminal doors that are built INTO KDE
# applications -- Dolphin's "Open Terminal Here", Kate's terminal panel, Konsole's own launch path --
# rather than only the Konsole icon. Removing an icon moves a problem; removing the action removes it.
#
# HONEST LIMIT, stated here and again in README.md: this group governs KDE applications. It is not a
# kernel-level restriction and it does not stop /usr/bin/bash from existing. `locked` therefore makes
# a bounded promise -- no root, no system software change, no network change, no stopping updates --
# and the mode that removes the shell entirely is `kiosk`. Anything more than that is asserted at
# runtime by locked/assert.sh or it is not claimed.
[KDE Action Restrictions][$i]
action/shell_access=false
action/run_command=false
action/start_new_session=false
action/switch_user=false
action/lock_screen=true
action/logout=true
action/kwin_rmb=false
action/editable_desktop_icons=false
action/options_configure_keybinding=false
action/edit_toolbars=false
action/options_configure_toolbars=false
action/movable_toolbars=false
