# Auros policy accounts and groups.
#
# aurosadmin  The ONE administrative group in managed/locked/kiosk. sudoers grants it; polkit names it
#             as the administrative identity. It is deliberately not `wheel`: `wheel` accumulates
#             members from anything that ever ran `usermod -aG wheel`, and a lockdown that can be
#             defeated by an old habit is not a lockdown.
#
#             NOTE (cross-layer dependency): this file creates the group EMPTY. The first-boot setup
#             layer is what puts the school's IT account in it. A managed/locked image whose
#             aurosadmin group has no members has no administrator at the seat at all. 20-policy.sh
#             prints a loud warning when it builds one.
#
# aurosprobe  An unprivileged, password-less, non-administrative account that exists so the mode can
#             be PROVEN at runtime (check B5). The assertion script runs as this user and tries the
#             forbidden things. It has a shell on purpose: an assertion that cannot run a command
#             cannot demonstrate that a command fails.
#
#             It has no password (`!` in shadow), so it is not reachable by login, ssh or su from an
#             unprivileged context -- becoming aurosprobe requires being root already.
g aurosadmin -
u aurosprobe - "Auros policy assertion probe" /var/lib/aurosprobe /usr/bin/bash
