# The account the kiosk application runs as.
#
# /usr/sbin/nologin is load-bearing, not tidiness: it means that even if something ever does reach
# this account -- a stray ssh key, a misconfigured autologin, a service that shells out -- there is no
# shell at the end of it. Combined with getty being masked and the desktop shell being removed from
# the image, there is no sequence of keystrokes at the machine that ends in a prompt.
#
# The home directory is under /var because it is machine-local state, and because a kiosk profile that
# survives a reimage is a kiosk profile somebody has been editing.
u auroskiosk - "Auros kiosk session" /var/lib/auroskiosk /usr/sbin/nologin
