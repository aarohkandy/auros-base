# KDE Kiosk -- URL restrictions for policy mode KIOSK.
#
# Format is KDE's, and it is positional:
#   rule_N = action,referringProtocol,referringHost,referringPath,protocol,host,path,enabled
# An empty field matches anything. `false` at the end means "refuse".
#
# What this stops: a Qt/KDE kiosk application being talked into opening or listing the local
# filesystem through a link -- the oldest kiosk escape there is. A browser in kiosk mode that follows
# a file:///etc/passwd link is a file manager with extra steps.
[KDE URL Restrictions][$i]
rule_count=3
rule_1=open,,,,file,,,false
rule_2=list,,,,file,,,false
rule_3=redirect,http,,,file,,,false
