# KDE Kiosk -- action restrictions for policy mode KIOSK.
#
# In kiosk there is no plasmashell left to restrict. This group is shipped anyway, for one reason:
# the kiosk application is very often a KDE- or Qt-based application, and these restrictions travel
# with the toolkit, not with the desktop. If the application ever gains a file dialog, a toolbar
# editor or an "open terminal" affordance, it is already restricted.
#
# Belt and braces is the right posture for the mode whose whole claim is that there is no way out.
[KDE Action Restrictions][$i]
action/shell_access=false
action/run_command=false
action/start_new_session=false
action/switch_user=false
action/lock_screen=false
action/logout=false
action/kwin_rmb=false
action/editable_desktop_icons=false
action/options_configure_keybinding=false
action/edit_toolbars=false
action/options_configure_toolbars=false
action/movable_toolbars=false
action/options_show_menubar=false
