# KDE Kiosk -- action restrictions for policy mode MANAGED.
#
# `[$i]` on the group header is KDE's immutability marker: the group becomes read-only, so a user's
# ~/.config/kdeglobals cannot override any key in it. Without `[$i]` every line below is a default
# and a default is a suggestion.
#
# This group is merged into /etc/xdg/kdeglobals. That file is SHARED -- the Windows-familiarity layer
# owns `[KDE]` (SingleClick and friends) in the same file. apply-policy rewrites only the three groups
# it owns and leaves everything else byte-for-byte. See policy/README.md, "the shared file".
#
# Managed removes the ways to walk out of the managed desktop sideways. It does not remove the
# terminal: a managed machine still has a competent adult behind it some of the time.
[KDE Action Restrictions][$i]
action/start_new_session=false
action/switch_user=false
action/lock_screen=true
action/logout=true
action/options_configure_keybinding=false
action/edit_toolbars=false
action/options_configure_toolbars=false
action/movable_toolbars=false
