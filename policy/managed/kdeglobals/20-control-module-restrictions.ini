# KDE Kiosk -- System Settings modules hidden in policy mode MANAGED.
#
# These are the panels whose settings polkit would refuse anyway. Hiding them is not the enforcement --
# the polkit rules are. This group exists so the machine does not offer a school a door it will then
# slam, which is how a managed desktop starts feeling broken instead of managed.
# kcm_users (Users) is NOT here: owner decision A4 shows it to aurosadmin members, so it is hidden in
# /etc/kde5rc instead, which an aurosadmin session skips. See policy/managed/root/etc/kde5rc.
[KDE Control Module Restrictions][$i]
kcm_sddm=false
kcm_kded=false
kcm_autostart=false
kcm_firewall=false
