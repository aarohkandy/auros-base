# /var does not exist in the container image -- bootc creates it on the machine -- so the update
# agent's state directory has to be declared here rather than mkdir'd at build time.
# See bootc's "building/guidance" docs: content written to /var in a Containerfile is only a
# default for the FIRST boot and is not a reliable place to put anything.
d /var/lib/auros            0755 root root -
d /var/lib/auros/update-agent 0755 root root -
