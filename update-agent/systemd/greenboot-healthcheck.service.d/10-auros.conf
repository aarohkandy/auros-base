# AUROS — give the health checks room to wait for the desktop.
#
# Two problems with the stock unit for our use:
#
# 1. greenboot-healthcheck.service is WantedBy=multi-user.target, but the display manager starts
#    as part of graphical.target, which is LATER. Check 20-graphical-target.sh therefore has to
#    poll and wait. B1 allows 120 s from power-on to a login prompt, so the check waits up to
#    that long -- and systemd's default TimeoutStartSec is 90 s, which would kill the check
#    before its own deadline and report a failure that never happened.
#
# 2. greenboot-default-health-checks ships a 10-network-online.conf drop-in that adds the
#    network-online ordering. We deliberately do NOT install that subpackage (see the README:
#    its 01_repository_dns_check.sh would roll a machine back for a DNS outage), so we have to
#    supply the ordering ourselves.

[Unit]
Wants=network-online.target
After=network-online.target

[Service]
TimeoutStartSec=300s
