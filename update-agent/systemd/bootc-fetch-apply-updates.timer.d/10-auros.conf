# AUROS — update cadence.
#
# Upstream bootc defaults (MEASURED at bootc-dev/bootc systemd/bootc-fetch-apply-updates.timer,
# read 2026-09-20):
#     OnBootSec=1h
#     OnUnitInactiveSec=8h
#     RandomizedDelaySec=2h
#
# Those defaults cannot satisfy check U1, which requires the machine to pull, stage and reboot
# within 20 minutes of the base moving, with no human action: 1h + up to 2h of jitter is an hour
# and a half of slack past the deadline in the best case.
#
# They also do not satisfy spec 6A's "pulls on boot".
#
# ── WHY THE EMPTY ASSIGNMENTS COME FIRST, AND WHY THEY ARE NOT OPTIONAL ─────────────────────────
#
# OnBootSec=, OnUnitInactiveSec=, OnActiveSec=, OnStartupSec=, OnUnitActiveSec= and OnCalendar=
# are LIST settings in systemd.timer(5): "may be specified more than once, in which case the timer
# unit will trigger multiple times". A drop-in APPENDS to the vendor value; it does not replace
# it. Resetting a list requires an empty assignment first.
#
# Without those resets this file did not set the schedule, it ADDED to it. The vendor's
# OnBootSec=1h and OnUnitInactiveSec=8h stayed live alongside ours, so a shipped machine fired at
# boot+3min AND boot+1h, then re-triggered at both 6h and 8h after every run — roughly double the
# cadence documented below, which doubles the B6 thundering-herd load this file exists to bound.
# A 180-machine school on one uplink pulling a 3.5 GB base is a ~630 GB event; running it twice
# as often is the opposite of what the RandomizedDelaySec number below was computed for.
#
# RandomizedDelaySec= and Persistent= are scalars and DO replace, which is why the jitter number
# was correct all along and the trigger times were not. Clearing the whole trigger list and then
# stating it means the schedule is exactly what the comments say it is, regardless of what the
# vendor unit carries today or after the next bootc bump.
#
# What we set, and why each number is the number it is:
#
#   OnBootSec=3min          "Pulls on boot." Three minutes, not zero, so the run happens after
#                           NetworkManager has had a chance to associate. School Wi-Fi is slow to
#                           come up and a fetch that starts before the link does is a wasted run.
#
#   RandomizedDelaySec=10min  B6: a 180-machine school shares one uplink and the base is 3.5 GB.
#                           Firing every laptop at once is a ~630 GB thundering herd. Ten minutes
#                           of spread is the largest jitter that still fits inside U1's 20-minute
#                           window (3 + 10 = 13 min worst case, leaving 7 minutes for the pull
#                           and the reboot). This number is a direct trade between U1 and B6; if
#                           U1's window ever widens, widen this first.
#
#   OnUnitInactiveSec=6h    Four checks a day. Aurora's own uupd.timer runs once daily at 04:00;
#                           six hours means a machine that is only ever on during school hours
#                           still gets at least one check per day.
#
#   Persistent=false        Stated, not assumed. A drop-in that merely OMITS a setting does not
#                           clear it, so "Persistent= is deliberately not set" was only ever true
#                           if the vendor unit happened not to set it — which this file never
#                           asserted. A missed window must not fire a catch-up run during the
#                           first minute of a lesson; the OnBootSec run already covers "the
#                           machine was off". (Persistent= only takes effect alongside
#                           OnCalendar=, which the reset below clears, so this is belt and braces
#                           against a future vendor unit that adds one.)
#
# The effective result is asserted, not described: see tests/run-tests.sh, and the
# `systemd-analyze cat-config` assertion requested of build/30-update-agent.sh in
# update-agent/README.md ("What this layer asks of the build script").

[Timer]
# --- reset every trigger list the vendor unit may carry -----------------------------------------
OnActiveSec=
OnBootSec=
OnStartupSec=
OnUnitActiveSec=
OnUnitInactiveSec=
OnCalendar=

# --- the Auros schedule, and nothing else -------------------------------------------------------
OnBootSec=3min
OnUnitInactiveSec=6h
RandomizedDelaySec=10min
Persistent=false
