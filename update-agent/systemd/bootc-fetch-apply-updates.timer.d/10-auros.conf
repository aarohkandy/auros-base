# AUROS — update cadence.
#
# Upstream bootc defaults (MEASURED at bootc-dev/bootc systemd/bootc-fetch-apply-updates.timer,
# read 2026-09-20):
#     OnBootSec=1h
#     OnUnitInactiveSec=8h
#     RandomizedDelaySec=2h
#
# Those defaults cannot satisfy check U1, which requires the machine to pull, stage and reboot
# within 20 minutes of the base moving, with no human action: 1h + up to 2h of jitter is an hour
# and a half of slack past the deadline in the best case.
#
# They also do not satisfy spec 6A's "pulls on boot".
#
# What we set, and why each number is the number it is:
#
#   OnBootSec=3min          "Pulls on boot." Three minutes, not zero, so the run happens after
#                           NetworkManager has had a chance to associate. School Wi-Fi is slow to
#                           come up and a fetch that starts before the link does is a wasted run.
#
#   RandomizedDelaySec=10min  B6: a 180-machine school shares one uplink and the base is 3.5 GB.
#                           Firing every laptop at once is a ~630 GB thundering herd. Ten minutes
#                           of spread is the largest jitter that still fits inside U1's 20-minute
#                           window (3 + 10 = 13 min worst case, leaving 7 minutes for the pull
#                           and the reboot). This number is a direct trade between U1 and B6; if
#                           U1's window ever widens, widen this first.
#
#   OnUnitInactiveSec=6h    Four checks a day. Aurora's own uupd.timer runs once daily at 04:00;
#                           six hours means a machine that is only ever on during school hours
#                           still gets at least one check per day.
#
# Persistent= is deliberately NOT set. A missed window must not cause a catch-up run to fire
# during the first minute of a lesson; the OnBootSec run already covers "the machine was off".

[Timer]
OnBootSec=3min
OnUnitInactiveSec=6h
RandomizedDelaySec=10min
