# AUROS — what the update run actually does.
#
# Upstream's ExecStart is `/usr/bin/bootc upgrade --apply --quiet` (MEASURED at
# bootc-dev/bootc systemd/bootc-fetch-apply-updates.service, read 2026-09-20). `--apply` reboots
# the machine as soon as a new deployment is staged.
#
# That is correct for a server and wrong for a classroom. Three minutes after a student opens the
# laptop, every morning there was a nightly base rebuild, the machine would restart underneath
# them. D4 ("clean end to end", "feel like personalized Windows") does not survive that.
#
# So we replace ExecStart with /usr/libexec/auros/auros-update, which always fetches and stages,
# and applies -- i.e. reboots -- only when nobody is actually using the machine. See that script
# for the rule and for /etc/auros/update-agent/apply-policy.
#
# We override the vendor unit rather than shipping our own timer so that there is exactly ONE
# update unit on the machine, with the name check S10 and the greenboot required check both look
# for. 30-update-agent.sh asserts the vendor unit file exists before installing this drop-in: if
# upstream ever renames it, the build fails loudly instead of the drop-in silently applying to
# nothing.
#
# The empty ExecStart= line is required: without it systemd appends to the vendor command rather
# than replacing it, and the machine would do both.

[Unit]
Wants=network-online.target
After=network-online.target

[Service]
ExecStart=
ExecStart=/usr/libexec/auros/auros-update
# The wrapper handles its own failures and exits 0 on the ones that are not our fault (registry
# unreachable -- U5; another updater holding the bootc lock). A non-zero exit here would show up
# as a failed unit, which the 40-no-new-failed-units health check would then read as a regression
# and roll the machine back over a flaky uplink.
SuccessExitStatus=0
